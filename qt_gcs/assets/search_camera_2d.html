<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{
      --search:#39e2cf;      /* AUTO search / no hold  */
      --scan:#ffc73a;     /* acquiring / handoff    */
      --track:#ffb020;       /* closing track          */
      --hold:#ff4235;        /* final / hold           */
      --hud:#cfe9dd;
      --reticle:var(--search);
    }
    html, body, #map, #offline { width:100%; height:100%; margin:0; overflow:hidden; background:#0a0d09; }
    body { font-family:"IBM Plex Mono",Consolas,monospace; color:var(--hud); }
    #offline {
      display:none; position:absolute; inset:0;
      background:
        linear-gradient(rgba(90,82,52,.22),rgba(70,64,42,.30)),
        repeating-linear-gradient(22deg,#5f5537 0,#5f5537 18px,#6d6042 19px,#6d6042 37px);
    }
    #offline::before {
      content:""; position:absolute; inset:0; opacity:.22;
      background-image:linear-gradient(#d6d0a318 1px,transparent 1px),linear-gradient(90deg,#d6d0a318 1px,transparent 1px);
      background-size:34px 34px;
    }
    /* soft optical vignette + faint noise for an EO/IR feel */
    #vignette{ position:absolute; inset:0; z-index:9; pointer-events:none;
      background:radial-gradient(120% 120% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%); }
    #subjectOffline { position:absolute; left:50%; top:50%; }
    .subject-wrap {
      position:absolute; width:64px; height:48px;
      transform:translate(-32px,-24px); pointer-events:none;
      will-change:left,top;
    }
    .subject-block {
      position:absolute; left:32px; top:24px;
      width:var(--subject-width,11.7px); height:var(--subject-height,7.15px);
      box-sizing:border-box; background:#050505; border:1px solid rgba(235,235,220,.72);
      box-shadow:0 1px 3px rgba(0,0,0,.95);
      transform:translate(-50%,-50%);
      transition:width 90ms linear,height 90ms linear;
      will-change:width,height;
    }
    /* corner-bracket hold reticle (no border box). 4 L-shaped corners drawn with
       background gradients so the box centre stays clear like a real tracking pod. */
    .track-box {
      position:absolute; left:32px; top:24px;
      width:var(--box-width,46px); height:var(--box-height,34px);
      box-sizing:border-box; transform:translate(-50%,-50%);
      --len:13px; --w:2px; --c:var(--reticle);
      background:
        linear-gradient(var(--c),var(--c)) left  top    / var(--len) var(--w) no-repeat,
        linear-gradient(var(--c),var(--c)) left  top    / var(--w) var(--len) no-repeat,
        linear-gradient(var(--c),var(--c)) right top    / var(--len) var(--w) no-repeat,
        linear-gradient(var(--c),var(--c)) right top    / var(--w) var(--len) no-repeat,
        linear-gradient(var(--c),var(--c)) left  bottom / var(--len) var(--w) no-repeat,
        linear-gradient(var(--c),var(--c)) left  bottom / var(--w) var(--len) no-repeat,
        linear-gradient(var(--c),var(--c)) right bottom / var(--len) var(--w) no-repeat,
        linear-gradient(var(--c),var(--c)) right bottom / var(--w) var(--len) no-repeat;
      filter:drop-shadow(0 0 4px color-mix(in srgb,var(--c) 70%,transparent));
      transition:width 90ms linear,height 90ms linear;
      will-change:width,height;
    }
    /* state palette */
    .subject-wrap.search   .track-box{ --reticle:var(--search); opacity:.85; }
    .subject-wrap.scan  .track-box{ --reticle:var(--scan); animation:sweep 1.1s ease-in-out infinite; }
    .subject-wrap.midcourse.track-box,.subject-wrap.midcourse .track-box{ --reticle:var(--track); --w:3px; }
    .subject-wrap.final .track-box{ --reticle:var(--hold); --w:3px; --len:16px; animation:holdpulse .5s ease-in-out infinite; }
    .subject-wrap.found .track-box{ --reticle:var(--hold); --w:3px; }
    @keyframes holdpulse{ 0%,100%{ filter:drop-shadow(0 0 3px var(--hold)); } 50%{ filter:drop-shadow(0 0 11px var(--hold)); } }
    @keyframes sweep{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
    /* center pip inside the reticle */
    .track-box::after{ content:""; position:absolute; left:50%; top:50%; width:3px; height:3px;
      transform:translate(-50%,-50%); background:var(--reticle); border-radius:50%; opacity:.9; }
    .track-label {
      display:none; position:absolute; left:50%; top:calc(50% - var(--box-height,34px)/2 - 14px);
      transform:translateX(-50%); padding:1px 6px; border-radius:2px;
      color:#07100b; background:var(--reticle); font-size:9px; font-weight:800; letter-spacing:.4px; white-space:nowrap;
    }
    .subject-wrap.search .track-label,.subject-wrap.scan .track-label,
    .subject-wrap.midcourse .track-label,.subject-wrap.final .track-label { display:block; }
    .subject-wrap.final .track-label{ color:#fff; }
    .subject-wrap.found .track-label { display:none; }
    .shutdown-cross,.shutdown-caption { display:none; position:absolute; z-index:8; }
    .shutdown-cross {
      left:32px; top:24px; transform:translate(-50%,-50%);
      color:var(--hold); font:900 min(24vw,132px)/.8 Arial,sans-serif;
      text-shadow:0 3px 4px #000,0 0 14px rgba(255,40,30,.8);
    }
    .shutdown-caption {
      left:32px; top:80px; transform:translateX(-50%);
      padding:4px 12px; color:#fff; background:rgba(120,10,8,.92); border-radius:2px;
      border:1px solid var(--hold); font:900 13px "IBM Plex Mono",Consolas,monospace;
      letter-spacing:2px; white-space:nowrap; box-shadow:0 2px 6px #000;
    }
    .subject-wrap.found .shutdown-cross,
    .subject-wrap.found .shutdown-caption { display:block; }
    #hud { position:absolute; inset:0; z-index:10; pointer-events:none; text-shadow:0 1px 2px #000; }
    /* boresight: thin cross + gapped centre + tick */
    #crosshair::before,#crosshair::after { content:""; position:absolute; background:rgba(205,239,205,.55); }
    #crosshair::before { left:50%; top:calc(50% - 16px); width:1px; height:12px; }
    #crosshair::after { left:calc(50% - 16px); top:50%; width:12px; height:1px; }
    #boresight{ position:absolute; left:50%; top:50%; width:5px; height:5px; transform:translate(-50%,-50%);
      border:1px solid rgba(205,239,205,.6); border-radius:50%; }
    .hud-panel{
      position:absolute; padding:5px 8px; background:rgba(3,9,5,.60);
      border:1px solid rgba(120,150,120,.28); border-radius:2px;
      font-size:9px; line-height:1.5; letter-spacing:.3px;
    }
    #topLeft { left:6px; top:6px; }
    #topRight { right:6px; top:6px; text-align:right; }
    #bottomLeft { left:6px; bottom:6px; }
    #bottomRight { right:6px; bottom:6px; text-align:right; }
    #holdChip{ color:#07100b; background:var(--reticle); font-weight:800; padding:1px 5px; border-radius:2px; }
    #modeChip{ color:var(--reticle); font-weight:800; }
    /* range bar (closure to subject) */
    #rangeBar{ position:absolute; right:10px; top:50%; transform:translateY(-50%);
      width:5px; height:120px; background:rgba(3,9,5,.55); border:1px solid rgba(120,150,120,.3); border-radius:3px; overflow:hidden; }
    #rangeFill{ position:absolute; left:0; bottom:0; width:100%; height:0%;
      background:linear-gradient(var(--hold),var(--track) 55%,var(--search)); transition:height .12s linear; }
    #scanlines { position:absolute; inset:0; opacity:.07; background:repeating-linear-gradient(0deg,transparent,transparent 3px,#baffc2 4px); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="offline"><div id="subjectOffline" class="subject-wrap"><div class="track-label"></div><div class="track-box"></div><div class="subject-block"></div><div class="shutdown-cross">✕</div><div class="shutdown-caption">SHUT DOWN</div></div></div>
  <div id="hud">
    <div id="crosshair"></div><div id="boresight"></div><div id="scanlines"></div>
    <div id="rangeBar"><div id="rangeFill"></div></div>
    <div id="topLeft" class="hud-panel"><span id="holdChip">NO HOLD</span></div>
    <div id="topRight" class="hud-panel"><span id="modeChip">AUTO SEARCH</span></div>
    <div id="bottomLeft" class="hud-panel">EO / NOMINAL</div>
    <div id="bottomRight" class="hud-panel">SLANT --</div>
  </div>
  <div id="vignette"></div>
  <script>
    const API_KEY = __API_KEY_JSON__;
    let map = null;
    let subjectOverlay = null;
    let latestState = null;
    let sourceStatus = API_KEY ? "GOOGLE SATELLITE LOADING" : "OFFLINE MAP PREVIEW";
    let googleLoadTimer = null;
    let prevSlant = null, prevStamp = null, closureMps = 0;   // for closure / ETA readout
    const mapElement = document.getElementById("map");
    const offline = document.getElementById("offline");
    const offlineSubject = document.getElementById("subjectOffline");

    function phaseClass(state) {
      if (state.found) return "found";
      if (state.phase === "FINAL_APPROACH") return "final";
      if (state.phase === "MIDCOURSE_APPROACH") return "midcourse";
      if (["DETECTION_TRANSIT", "INITIAL_APPROACH"].includes(state.phase)) return "scan";
      return "search";
    }
    function subjectLabel(state) {
      if (state.found) return "SHUT DOWN";
      if (state.phase === "FINAL_APPROACH") return "HOLD / FINAL";
      if (state.phase === "MIDCOURSE_APPROACH") return "TRACK / CLOSING";
      if (["DETECTION_TRANSIT", "INITIAL_APPROACH"].includes(state.phase)) return "AUTO SCAN";
      return "VISUAL";
    }
    function setSubjectStyle(element, state) {
      element.className = `subject-wrap ${phaseClass(state)}`;
      element.querySelector(".track-label").textContent = subjectLabel(state);
      element.style.display = state.subject_visible ? "block" : "none";
      const altitude = Math.max(1, Number(state.altitude_separation_m || 0));
      const coverageRadius = Math.max(1, Number(state.coverage_m || 1200) / 2);
      const maximumSlant = Math.hypot(coverageRadius, altitude);
      const slant = Math.max(0, Number(state.slant_distance_m ?? maximumSlant));
      const proximity = Math.max(0, Math.min(1, 1 - slant / maximumSlant));
      const approachGrowth = Math.pow(proximity, 2.2);
      const maximumSubjectScale = Math.max(.65, document.body.clientWidth * .98 / 18);
      const subjectScale = .65 + approachGrowth * (maximumSubjectScale - .65);
      const maximumBoxWidth = document.body.clientWidth;
      const maximumBoxHeight = Math.min(document.body.clientHeight * .92, 11 * maximumSubjectScale + 30);
      // reticle stays a touch larger than the subject block and closes in on approach
      const boxWidth = 46 + approachGrowth * (maximumBoxWidth - 46);
      const boxHeight = 34 + approachGrowth * (maximumBoxHeight - 34);
      element.style.setProperty("--subject-scale", String(subjectScale));
      element.style.setProperty("--box-scale", String(boxWidth / 56));
      element.style.setProperty("--subject-width", `${18 * subjectScale}px`);
      element.style.setProperty("--subject-height", `${11 * subjectScale}px`);
      element.style.setProperty("--box-width", `${boxWidth}px`);
      element.style.setProperty("--box-height", `${boxHeight}px`);
    }
    function refreshHud(state) {
      const cls = phaseClass(state);
      document.documentElement.style.setProperty("--reticle",
        `var(--${cls === "found" || cls === "final" ? "hold" : cls === "midcourse" ? "track" : cls === "scan" ? "scan" : "search"})`);
      const holdChip = document.getElementById("holdChip");
      holdChip.textContent = state.found ? "SHUT DOWN" : (state.held ? "● HOLD" : (cls === "midcourse" ? "TRACK" : cls === "scan" ? "SCAN" : "NO HOLD"));
      document.getElementById("modeChip").textContent = state.camera_mode || "AUTO SEARCH";
      document.getElementById("bottomLeft").textContent = `${sourceStatus} / EO`;
      const slant = Number(state.slant_distance_m || 0);
      const eta = (closureMps > 0.5 && slant > 0) ? (slant / closureMps) : null;
      document.getElementById("bottomRight").innerHTML =
        `SLANT ${(slant/1000).toFixed(2)}KM · H ${(Number(state.horizontal_distance_m||0)/1000).toFixed(2)}KM<br>` +
        `ΔALT ${Number(state.altitude_separation_m||0).toFixed(0)}M · CLS ${closureMps.toFixed(0)}m/s` +
        (eta !== null ? ` · ETA ${eta.toFixed(0)}s` : "");
      // range bar: fuller as subject gets closer
      const cover = Math.max(1, Number(state.coverage_m || 1200));
      const frac = Math.max(0, Math.min(1, 1 - slant / cover));
      document.getElementById("rangeFill").style.height = `${(frac*100).toFixed(0)}%`;
    }
    function updateClosure(state){
      const now = performance.now()/1000;
      const slant = Number(state.slant_distance_m || 0);
      if (prevSlant !== null && prevStamp !== null){
        const dt = now - prevStamp;
        if (dt > 0.02){ const inst = (prevSlant - slant)/dt; closureMps = 0.6*closureMps + 0.4*inst; }
      }
      prevSlant = slant; prevStamp = now;
    }

    function createSubjectOverlay() {
      return new (class GoogleSubjectOverlay extends google.maps.OverlayView {
        constructor() { super(); this.element = document.createElement("div"); this.element.innerHTML = '<div class="track-label"></div><div class="track-box"></div><div class="subject-block"></div><div class="shutdown-cross">✕</div><div class="shutdown-caption">SHUT DOWN</div>'; }
        onAdd() { this.getPanes().overlayMouseTarget.appendChild(this.element); }
        draw() {
          if (!latestState || !latestState.subject_visible) { this.element.style.display = "none"; return; }
          const projection = this.getProjection();
          const point = projection.fromLatLngToDivPixel(new google.maps.LatLng(latestState.subject.latitude, latestState.subject.longitude));
          if (!point) { this.element.style.display = "none"; return; }
          this.element.style.left = `${point.x}px`; this.element.style.top = `${point.y}px`;
          setSubjectStyle(this.element, latestState);
        }
        onRemove() { this.element.remove(); }
      })();
    }

    function applyGoogleState(state) {
      if (!map) return;
      offline.style.display = "none";
      mapElement.style.display = "block";
      const center = {lat:Number(state.vehicle.latitude),lng:Number(state.vehicle.longitude)};
      const width = Math.max(240, document.body.clientWidth);
      const mpp = Number(state.coverage_m || 1200) / width;
      const zoom = Math.max(12, Math.min(20, Math.log2(156543.03392 * Math.cos(center.lat * Math.PI / 180) / mpp)));
      state.zoom = zoom;
      map.setCenter(center);
      if (Math.abs(Number(map.getZoom() || 0) - zoom) > .05) map.setZoom(zoom);
      if (subjectOverlay) subjectOverlay.draw();
      refreshHud(state);
    }
    function applyOfflineState(state) {
      offline.style.display = "block";
      mapElement.style.display = "none";
      const cover = Math.max(100, Number(state.coverage_m || 1200));
      const latitudeScale = 111320;
      const longitudeScale = 111320 * Math.cos(Number(state.vehicle.latitude) * Math.PI / 180);
      const east = (Number(state.subject.longitude) - Number(state.vehicle.longitude)) * longitudeScale;
      const north = (Number(state.subject.latitude) - Number(state.vehicle.latitude)) * latitudeScale;
      offlineSubject.style.left = `${50 + east / cover * 100}%`;
      offlineSubject.style.top = `${50 - north / cover * 100}%`;
      setSubjectStyle(offlineSubject, state);
      state.zoom = 16;
      refreshHud(state);
    }
    window.updateSearchCamera = state => {
      latestState = state;
      if (!state || !state.vehicle || !state.subject) return;
      updateClosure(state);
      if (map) applyGoogleState(state); else applyOfflineState(state);
    };
    function initGoogle() {
      if (googleLoadTimer) clearTimeout(googleLoadTimer);
      sourceStatus = "GOOGLE SATELLITE";
      offline.style.display = "none";
      mapElement.style.display = "block";
      map = new google.maps.Map(mapElement, {
        center:{lat:23.7438,lng:47.3281}, zoom:16, mapTypeId:"satellite",
        disableDefaultUI:true, gestureHandling:"none", keyboardShortcuts:false,
        clickableIcons:false, tilt:0, heading:0, backgroundColor:"#0a0d09"
      });
      subjectOverlay = createSubjectOverlay(); subjectOverlay.setMap(map);
      if (latestState) applyGoogleState(latestState);
    }
    if (API_KEY) {
      window.initGoogle = initGoogle;
      window.gm_authFailure = () => {
        sourceStatus = "GOOGLE AUTH FAILED / OFFLINE";
        map = null;
        if (latestState) applyOfflineState(latestState);
      };
      const script = document.createElement("script");
      script.async = true; script.defer = true;
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(API_KEY)}&callback=initGoogle&v=weekly`;
      script.onerror = () => {
        sourceStatus = "GOOGLE LOAD FAILED / OFFLINE";
        if (latestState) applyOfflineState(latestState);
      };
      document.head.appendChild(script);
      googleLoadTimer = setTimeout(() => {
        if (map) return;
        sourceStatus = "GOOGLE TIMEOUT / OFFLINE";
        if (latestState) applyOfflineState(latestState);
      }, 8000);
    } else {
      offline.style.display = "block";
    }
    window.searchCameraReady = true;
  </script>
</body>
</html>
